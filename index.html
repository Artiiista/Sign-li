<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Signāli">
<meta name="theme-color" content="#1A2127">
<title>Signāli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4E8EB;--panel:#F7F8F9;--ink:#1D2A33;--muted:#5E6B74;--line:#C5CDD3;--field:#fff;
  --long:#2E7D4F;--short:#B23A2E;--flat:#6B7780;--warn:#C8871A;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1A2127;--panel:#232C33;--ink:#E3E8EC;--muted:#93A0A9;--line:#3A4751;--field:#2B353D;
  --long:#4CAF78;--short:#E0645A;--flat:#8794A0;--warn:#E3A33B;}}
:root[data-theme="dark"]{--bg:#1A2127;--panel:#232C33;--ink:#E3E8EC;--muted:#93A0A9;--line:#3A4751;--field:#2B353D;
  --long:#4CAF78;--short:#E0645A;--flat:#8794A0;--warn:#E3A33B;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Barlow,"Segoe UI",Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:16px 14px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
h1{font:700 1.7rem/1 "Barlow Semi Condensed",Barlow,Arial,sans-serif;margin:0}
.upd{color:var(--muted);font-size:.8rem;margin-top:3px}
.btn{font:600 .95rem Barlow,Arial,sans-serif;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:6px;padding:9px 14px;cursor:pointer}
.btn:active{transform:translateY(1px)}
.coins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.coin{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 8px;text-align:left;cursor:pointer;color:var(--ink);font:inherit}
.coin[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.coin b{display:block;font:700 1.05rem "Barlow Semi Condensed",Arial,sans-serif}
.coin small{display:block;color:var(--muted);font-size:.8rem}
.tag{display:inline-block;margin-top:6px;font:700 .75rem Barlow,Arial,sans-serif;letter-spacing:.04em;padding:2px 7px;border-radius:3px;color:#fff;background:var(--flat)}
.tag.l{background:var(--long)}.tag.s{background:var(--short)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:12px}
.sig{border-left:6px solid var(--flat)}
.sig.l{border-left-color:var(--long)}.sig.s{border-left-color:var(--short)}
.sig h2{font:700 2rem/1 "Barlow Semi Condensed",Arial,sans-serif;margin:0 0 4px}
.sig.l h2{color:var(--long)}.sig.s h2{color:var(--short)}
.sig p{margin:0;color:var(--muted);font-size:.9rem}
h3{font:700 1.05rem "Barlow Semi Condensed",Arial,sans-serif;margin:0 0 10px;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}
.kv small{display:block;color:var(--muted);font-size:.8rem}
.kv strong{font:700 1.25rem "Barlow Semi Condensed",Arial,sans-serif}
.kv .pos{color:var(--long)}.kv .neg{color:var(--short)}
.verdict{margin:12px 0 0;padding:9px 11px;border-left:4px solid var(--warn);font-size:.92rem;background:color-mix(in srgb,var(--warn) 12%,transparent)}
.verdict.good{border-color:var(--long);background:color-mix(in srgb,var(--long) 12%,transparent)}
.verdict.bad{border-color:var(--short);background:color-mix(in srgb,var(--short) 12%,transparent)}
svg.curve{width:100%;height:90px;display:block;margin-top:12px}
.set{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px}
input[type=number]{width:100%;font:500 1rem Barlow,Arial,sans-serif;padding:9px;border:1px solid var(--line);border-radius:4px;background:var(--field);color:var(--ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{font:600 .95rem Barlow,Arial,sans-serif;padding:9px;border:0;background:var(--field);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
input:focus,button:focus-visible{outline:2px solid var(--warn);outline-offset:1px}
.err{color:var(--short);font-size:.92rem}
.foot{color:var(--muted);font-size:.78rem;margin-top:14px}
</style>
</head>
<body>
<main>
  <div class="top">
    <div><h1>Signāli</h1><div class="upd" id="upd">Ielādē…</div></div>
    <button class="btn" id="refresh">↻ Atjaunot</button>
  </div>
  <div class="coins" id="coins"></div>
  <div id="detail"></div>
  <section class="panel">
    <h3>Iestatījumi</h3>
    <div class="set">
      <div><label>Sveces</label><div class="seg" id="tfSeg"><button data-v="1440">1 diena</button><button data-v="240">4 h</button></div></div>
      <div><label>Virziens</label><div class="seg" id="dirSeg"><button data-v="1">Tikai LONG</button><button data-v="0">LONG + SHORT</button></div></div>
      <div><label for="risk">Risks uz darījumu ($)</label><input id="risk" type="number" inputmode="decimal" step="0.5"></div>
      <div><label for="lev">Svira</label><input id="lev" type="number" inputmode="decimal" step="1"></div>
    </div>
  </section>
  <p class="foot" id="src"></p>
  <p class="foot">Signāls tiek rēķināts pēc pēdējās <b>noslēgtās</b> sveces (tāpat kā TradingView „On bar close”). Stratēģija: EMA20/50/200 + RSI filtrs, stop 1,5×ATR, take-profit 2R. Šis nav finanšu padoms.</p>
</main>
<script>
// ===== Aprēķinu kodols (tāda pati loģika kā kraken_analize.py) =====
function ema(a, n) { const k = 2 / (n + 1), o = []; a.forEach((v, i) => o.push(i ? v * k + o[i - 1] * (1 - k) : v)); return o; }
function wilder(a, n) { const k = 1 / n, o = []; a.forEach((v, i) => o.push(i ? v * k + o[i - 1] * (1 - k) : v)); return o; }

function indicators(c, P) {
  const cl = c.map(x => x.c);
  const e20 = ema(cl, 20), e50 = ema(cl, 50), e200 = ema(cl, 200);
  const g = [0], l = [0];
  for (let i = 1; i < cl.length; i++) { const d = cl[i] - cl[i - 1]; g.push(Math.max(d, 0)); l.push(Math.max(-d, 0)); }
  const ag = wilder(g.slice(1), 14), al = wilder(l.slice(1), 14);
  const rsi = [NaN].concat(ag.map((x, i) => al[i] === 0 ? 100 : 100 - 100 / (1 + x / al[i])));
  const tr = c.map((x, i) => i ? Math.max(x.h - x.l, Math.abs(x.h - c[i - 1].c), Math.abs(x.l - c[i - 1].c)) : x.h - x.l);
  const atr = wilder(tr, 14);
  return c.map((x, i) => {
    const r = rsi[i];
    let s = 0;
    if (e20[i] > e50[i] && x.c > e200[i] && r >= 50 && r <= 70) s = 1;
    else if (!P.longOnly && e20[i] < e50[i] && x.c < e200[i] && r >= 30 && r <= 50) s = -1;
    return { ...x, e20: e20[i], e50: e50[i], e200: e200[i], rsi: r, atr: atr[i], s };
  });
}

function backtest(d, P) {
  const warm = 200, fee = 0.0005, out = [];
  let p = null;
  for (let i = warm; i < d.length - 1; i++) {
    const c = d[i], n = d[i + 1];
    if (!p) {
      if (c.s) {
        const v = c.s, e = n.o, a = P.atrMult * c.atr;
        p = { v, e, a, t: n.t, sl: e - v * a, tp: e + v * a * P.rr };
      }
      continue;
    }
    const hitSL = p.v === 1 ? c.l <= p.sl : c.h >= p.sl;
    const hitTP = p.v === 1 ? c.h >= p.tp : c.l <= p.tp;
    if (hitSL || hitTP) {
      const x = hitSL ? p.sl : p.tp;
      const R = p.v * (x - p.e) / p.a - fee * (p.e + x) / p.a;
      out.push({ t: p.t, v: p.v, R });
      p = null;
    }
  }
  return out;
}

function stats(tr) {
  if (!tr.length) return null;
  let cum = 0, peak = 0, dd = 0, gp = 0, gl = 0;
  const curve = [0];
  tr.forEach(x => { cum += x.R; curve.push(cum); peak = Math.max(peak, cum); dd = Math.min(dd, cum - peak); if (x.R > 0) gp += x.R; else gl -= x.R; });
  return { n: tr.length, win: tr.filter(x => x.R > 0).length / tr.length, avg: cum / tr.length, total: cum, dd, pf: gl ? gp / gl : Infinity, curve };
}

// ===== Lietotne =====
const COINS = [
  { id: "BTC", name: "Bitcoin", kraken: "XBTUSD", binance: "BTCUSDT" },
  { id: "ETH", name: "Ethereum", kraken: "ETHUSD", binance: "ETHUSDT" },
  { id: "SOL", name: "Solana", kraken: "SOLUSD", binance: "SOLUSDT" },
];
const $ = id => document.getElementById(id);
const S = { tf: 1440, longOnly: true, risk: 2, lev: 3, sel: "BTC" };
try { Object.assign(S, JSON.parse(localStorage.getItem("signali") || "{}")); } catch (e) {}
const save = () => { try { localStorage.setItem("signali", JSON.stringify(S)); } catch (e) {} };
const raw = {}; let source = "";

const fmtP = p => !isFinite(p) ? "–" : p.toLocaleString("en-US", { minimumFractionDigits: p >= 1000 ? 0 : 2, maximumFractionDigits: p >= 1000 ? 0 : 2 });
const fmt = (n, d = 2) => isFinite(n) ? n.toLocaleString("lv-LV", { minimumFractionDigits: d, maximumFractionDigits: d }) : "–";
const sgn = (n, d = 2) => (n > 0 ? "+" : "") + fmt(n, d);

async function fromKraken(pair, tf) {
  const r = await fetch(`https://api.kraken.com/0/public/OHLC?pair=${pair}&interval=${tf}`);
  const j = await r.json();
  if (j.error && j.error.length) throw new Error(j.error.join(", "));
  const key = Object.keys(j.result).find(k => k !== "last");
  const now = Date.now() / 1000;
  return j.result[key]
    .map(x => ({ t: x[0] * 1000, o: +x[1], h: +x[2], l: +x[3], c: +x[4], closed: x[0] + tf * 60 <= now }));
}
async function fromBinance(sym, tf) {
  const iv = tf === 1440 ? "1d" : "4h";
  const r = await fetch(`https://data-api.binance.vision/api/v3/klines?symbol=${sym}&interval=${iv}&limit=1000`);
  const j = await r.json();
  const now = Date.now();
  return j.map(x => ({ t: x[0], o: +x[1], h: +x[2], l: +x[3], c: +x[4], closed: x[6] < now }));
}

async function load() {
  $("upd").textContent = "Ielādē…";
  $("refresh").disabled = true;
  const errs = [];
  await Promise.all(COINS.map(async c => {
    try { raw[c.id] = await fromKraken(c.kraken, S.tf); raw[c.id].src = "Kraken"; }
    catch (e) {
      try { raw[c.id] = await fromBinance(c.binance, S.tf); raw[c.id].src = "Binance (rezerves)"; }
      catch (e2) { raw[c.id] = null; errs.push(c.id); }
    }
  }));
  $("refresh").disabled = false;
  const srcs = [...new Set(COINS.map(c => raw[c.id] && raw[c.id].src).filter(Boolean))];
  $("src").textContent = srcs.length ? "Dati: " + srcs.join(", ") + (errs.length ? ` · Neizdevās: ${errs.join(", ")}` : "") : "";
  $("upd").textContent = errs.length === COINS.length ? "Neizdevās ielādēt datus" :
    "Atjaunots " + new Date().toLocaleTimeString("lv-LV", { hour: "2-digit", minute: "2-digit" });
  render();
}

function analyse(id) {
  const all = raw[id];
  if (!all || all.length < 260) return null;
  const closed = all.filter(x => x.closed);
  const P = { longOnly: S.longOnly, atrMult: 1.5, rr: 2 };
  const d = indicators(closed, P);
  const st = stats(backtest(d, P));
  const last = d[d.length - 1];
  return { d, st, last, live: all[all.length - 1].c };
}

function render() {
  const res = {};
  COINS.forEach(c => res[c.id] = analyse(c.id));
  $("coins").innerHTML = COINS.map(c => {
    const r = res[c.id];
    const s = r ? r.last.s : 0;
    const tag = !r ? `<span class="tag">NAV DATU</span>` : s === 1 ? `<span class="tag l">LONG</span>` : s === -1 ? `<span class="tag s">SHORT</span>` : `<span class="tag">GAIDĪT</span>`;
    return `<button class="coin" data-id="${c.id}" aria-pressed="${S.sel === c.id}"><b>${c.id}</b><small>${r ? "$" + fmtP(r.live) : "–"}</small>${tag}</button>`;
  }).join("");
  document.querySelectorAll(".coin").forEach(b => b.onclick = () => { S.sel = b.dataset.id; save(); render(); });
  $("detail").innerHTML = detail(COINS.find(c => c.id === S.sel), res[S.sel]);
}

function detail(c, r) {
  if (!r) return `<section class="panel"><p class="err">Nav datu par ${c.name}. Pārbaudi internetu un spied „Atjaunot”.</p></section>`;
  const L = r.last, v = L.s;
  const dist = 1.5 * L.atr, sl = L.c - v * dist, tp = L.c + v * dist * 2;
  const qty = S.risk / dist, val = qty * L.c, mar = val / S.lev;
  const day = new Date(L.t).toLocaleDateString("lv-LV", { day: "numeric", month: "short" });
  const why = `RSI ${fmt(L.rsi, 1)} · cena ${L.c > L.e200 ? "virs" : "zem"} EMA200 · EMA20 ${L.e20 > L.e50 ? "virs" : "zem"} EMA50`;
  let sig;
  if (v) {
    sig = `<section class="panel sig ${v === 1 ? "l" : "s"}"><h2>${c.id} ${v === 1 ? "LONG" : "SHORT"}</h2><p>${c.name} · svece ${day} · ${why}</p>
      <div class="kv" style="margin-top:14px">
        <div><small>Ieeja (pēdējā slēgšana)</small><strong>$${fmtP(L.c)}</strong></div>
        <div><small>Tagad</small><strong>$${fmtP(r.live)}</strong></div>
        <div><small>Stop-loss</small><strong class="neg">$${fmtP(sl)}</strong><small>${sgn((sl - L.c) / L.c * 100)}%</small></div>
        <div><small>Take-profit</small><strong class="pos">$${fmtP(tp)}</strong><small>${sgn((tp - L.c) / L.c * 100)}%</small></div>
        <div><small>Pozīcija</small><strong>${fmt(qty, qty < 1 ? 5 : 3)} ${c.id}</strong><small>≈ $${fmt(val)}</small></div>
        <div><small>Margin (${S.lev}x)</small><strong>$${fmt(mar)}</strong><small>Risks $${fmt(S.risk)}</small></div>
      </div></section>`;
  } else {
    sig = `<section class="panel sig"><h2>${c.id} · GAIDĪT</h2><p>${c.name} · svece ${day} · nosacījumi nav izpildīti</p><p style="margin-top:6px">${why}</p>
      <div class="kv" style="margin-top:14px"><div><small>Tagad</small><strong>$${fmtP(r.live)}</strong></div><div><small>ATR</small><strong>$${fmtP(L.atr)}</strong></div></div></section>`;
  }
  const st = r.st;
  let bt;
  if (!st) bt = `<p>Backtestā nebija darījumu.</p>`;
  else {
    const from = new Date(r.d[200].t).toLocaleDateString("lv-LV"), to = new Date(r.d[r.d.length - 1].t).toLocaleDateString("lv-LV");
    let vc = "", vt = "";
    if (st.avg <= 0) { vc = "bad"; vt = "Šajā periodā stratēģija NEPELNĪJA. Netirgo pēc šī signāla."; }
    else if (st.n < 30) { vt = "Plusā, bet par maz darījumu, lai spriestu."; }
    else { vc = "good"; vt = "Plusā ar pietiekami daudz darījumiem. Tas tomēr nav garantija nākotnei."; }
    bt = `<div class="kv">
        <div><small>Darījumi</small><strong>${st.n}</strong></div>
        <div><small>Uzvaras</small><strong>${fmt(st.win * 100, 0)}%</strong></div>
        <div><small>Vidēji uz darījumu</small><strong class="${st.avg > 0 ? "pos" : "neg"}">${sgn(st.avg)} R</strong></div>
        <div><small>Kopā</small><strong class="${st.total > 0 ? "pos" : "neg"}">${sgn(st.total, 1)} R</strong><small>ar $${fmt(S.risk)} risku: ${sgn(st.total * S.risk)} $</small></div>
        <div><small>Profit factor</small><strong>${isFinite(st.pf) ? fmt(st.pf) : "∞"}</strong></div>
        <div><small>Lielākais kritums</small><strong class="neg">${fmt(st.dd, 1)} R</strong></div>
      </div>${curve(st.curve)}<p class="foot" style="margin:6px 0 0">${from} → ${to}</p><p class="verdict ${vc}">${vt}</p>`;
  }
  return sig + `<section class="panel"><h3>Backtests · ${c.id} · ${S.tf === 1440 ? "1D" : "4h"}</h3>${bt}</section>`;
}

function curve(pts) {
  const W = 300, H = 90, lo = Math.min(0, ...pts), hi = Math.max(0, ...pts), sp = hi - lo || 1;
  const x = i => i / (pts.length - 1 || 1) * W, y = v => H - 4 - (v - lo) / sp * (H - 8);
  const line = pts.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const col = pts[pts.length - 1] >= 0 ? "var(--long)" : "var(--short)";
  return `<svg class="curve" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Kumulatīvā peļņa R vienībās">
    <line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)" stroke-dasharray="3 3"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}

function segs() {
  const set = (el, key, conv) => {
    el.querySelectorAll("button").forEach(b => {
      b.setAttribute("aria-pressed", String(conv(b.dataset.v) === S[key]));
      b.onclick = () => { const nv = conv(b.dataset.v); const reload = key === "tf" && nv !== S.tf; S[key] = nv; save(); segs(); reload ? load() : render(); };
    });
  };
  set($("tfSeg"), "tf", v => +v);
  set($("dirSeg"), "longOnly", v => v === "1");
}
$("risk").value = S.risk; $("lev").value = S.lev;
$("risk").oninput = e => { const v = parseFloat(e.target.value); if (v > 0) { S.risk = v; save(); render(); } };
$("lev").oninput = e => { const v = parseFloat(e.target.value); if (v >= 1) { S.lev = v; save(); render(); } };
$("refresh").onclick = load;
segs();
load();
</script>
</body></html>
